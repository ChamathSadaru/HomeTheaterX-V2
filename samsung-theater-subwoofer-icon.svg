<svg viewBox="0 0 160 260" width="160" height="260" xmlns="http://www.w3.org/2000/svg" style="font-family: monospace;">
  <defs>
    <pattern id="mesh-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#3f3f46" />
      <circle cx="2" cy="2" r="0.6" fill="#18181b" />
    </pattern>
    <filter id="audio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="subwoofer-cabinet-realistic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#25252b" />
      <stop offset="10%" stopColor="#0b0b0e" />
      <stop offset="50%" stopColor="#040405" />
      <stop offset="85%" stopColor="#0a0a0d" />
      <stop offset="100%" stopColor="#1e1e24" />
    </linearGradient>
    <linearGradient id="mesh-bezel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#4b4b52" />
      <stop offset="50%" stopColor="#222227" />
      <stop offset="100%" stopColor="#121215" />
    </linearGradient>
    <radialGradient id="mesh-shading" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stopColor="transparent" />
      <stop offset="80%" stopColor="rgba(0, 0, 0, 0.4)" />
      <stop offset="100%" stopColor="rgba(0, 0, 0, 0.85)" />
    </radialGradient>
    <radialGradient id="funnel-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#010102" />
      <stop offset="40%" stopColor="#08080a" />
      <stop offset="65%" stopColor="#15151c" />
      <stop offset="80%" stopColor="#292933" />
      <stop offset="90%" stopColor="#3c3c4a" />
      <stop offset="96%" stopColor="#121216" />
      <stop offset="100%" stopColor="#060608" />
    </radialGradient>
    <linearGradient id="funnel-highlight-grad" x1="0%" y1="1%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />
      <stop offset="40%" stopColor="#ffffff" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="cabinet-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.12" />
      <stop offset="3%" stopColor="#ffffff" stopOpacity="0" />
      <stop offset="97%" stopColor="#ffffff" stopOpacity="0" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Subwoofer Main Cabinet Frame -->
  <rect x="20" y="10" width="120" height="240" rx="6" fill="url(#subwoofer-cabinet-realistic)" stroke="#52525b" stroke-width="2" />
  
  
  <rect x="21" y="11" width="118" height="238" rx="5" fill="none" stroke="url(#cabinet-highlight)" stroke-width="1.5" />
  <line x1="24" y1="12" x2="136" y2="12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />
  <path d="M 21,25 L 139,150 L 139,135 L 21,10 Z" fill="#ffffff" opacity="0.02" />

  <!-- Top Main Driver Section (Mesh circular dome) -->
  <circle cx="80" cy="72" r="52" fill="url(#mesh-bezel-grad)" stroke="#52525b" stroke-width="2" />
  <circle cx="80" cy="72" r="50.5" fill="#050507" />
  <circle cx="80" cy="72" r="50" fill="url(#mesh-pattern)" />
  <circle cx="80" cy="72" r="50" fill="url(#mesh-shading)" />

  <!-- Bottom Bass Reflex Port (Glossy funnel) -->
  <circle cx="80" cy="192" r="42" fill="url(#funnel-gradient)" stroke="#52525b" stroke-width="2" />
  <ellipse cx="80" cy="216" rx="32" ry="10" fill="url(#funnel-highlight-grad)" />
  <circle cx="80" cy="192" r="20" fill="#020204" stroke="#52525b" stroke-width="1" />

  <text x="80" y="244" text-anchor="middle" font-size="6" fill="#f59e0b" font-weight="bold" letter-spacing="1.2">SAMSUNG</text>
</svg>