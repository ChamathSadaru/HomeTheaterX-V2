<svg viewBox="0 0 200 100" width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="mesh-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3f3f46" />
    </pattern>
    <filter id="audio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Center Cabinet (Compact Design) -->
  <rect x="40" y="30" width="120" height="40" rx="4" fill="#1e1e24" stroke="#52525b" stroke-width="2" />
  <!-- Mesh Grille -->
  <rect x="43" y="33" width="114" height="34" rx="2" fill="url(#mesh-pattern)" stroke="#52525b" stroke-width="1.4" />
  <!-- Left & Right Air Vents (Deep Black Circles) -->
  <circle cx="68" cy="50" r="8" fill="#000000" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" />
  <circle cx="132" cy="50" r="8" fill="#000000" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" />
  <!-- Center Speaker Driver -->
  <circle cx="100" cy="50" r="14" fill="#18181b" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <circle cx="100" cy="50" r="9" fill="#f59e0b" filter="url(#audio-glow)" />
</svg>