<svg viewBox="0 0 120 280" width="120" height="280" xmlns="http://www.w3.org/2000/svg" style="font-family: monospace;">
  <defs>
    <pattern id="mesh-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3f3f46" />
    </pattern>
    <filter id="audio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 3D Base Thickness Rim (Extrusion) -->
  <path d="M 15,265 L 20,270 L 100,270 L 105,265 L 105,271 L 100,276 L 20,276 L 15,271 Z" fill="#09090b" stroke="#52525b" stroke-width="2" />
  <!-- Top Face of the Faceted Hexagonal Base Stand -->
  <path d="M 30,235 L 90,235 L 105,265 L 100,270 L 20,270 L 15,265 Z" fill="#141418" stroke="#52525b" stroke-width="2" />
  
  <path d="M 15,265 L 20,270 L 100,270 L 105,265" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.2" />
  <line x1="30" y1="235" x2="90" y2="235" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.8" />
  <defs><linearGradient id="glass-spec-raw" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,0.45)"/><stop offset="15%" stop-color="rgba(255,255,255,0.6)"/><stop offset="30%" stop-color="rgba(255,255,255,0.1)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></linearGradient></defs>
  <path d="M 42,235 L 68,235 L 90,270 L 65,270 Z" fill="url(#glass-spec-raw)" opacity="0.65" />
  
  <!-- Main Column Speaker Frame (Drawn over the stand) -->
  <rect x="41" y="15" width="38" height="230" rx="3" fill="#1e1e24" stroke="#52525b" stroke-width="2" />
  <!-- Upper Grille / Mesh Section -->
  <rect x="44" y="18" width="32" height="105" rx="2" fill="url(#mesh-pattern)" stroke="#52525b" stroke-width="1.4" />
  <!-- Internal Mid-Range Drivers -->
  <circle cx="60" cy="45" r="10" fill="#18181b" stroke="#f59e0b" stroke-width="1" />
  <circle cx="60" cy="45" r="4" fill="#f59e0b" filter="url(#audio-glow)" />
  <circle cx="60" cy="85" r="10" fill="#18181b" stroke="#f59e0b" stroke-width="1" />
  <circle cx="60" cy="85" r="4" fill="#f59e0b" filter="url(#audio-glow)" />
  <!-- Bevel line -->
  <line x1="41" y1="123" x2="79" y2="123" stroke="#52525b" stroke-width="3" />
  <text x="60" y="236" text-anchor="middle" font-size="6" fill="#f59e0b" letter-spacing="1">SAMSUNG</text>
</svg>